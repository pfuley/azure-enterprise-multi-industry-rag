<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Authentication Redirect</title>
</head>

<body>

    <p>Processing authentication...</p>

    <script type="module">
        import {
            broadcastResponseToMainFrame
        } from "@azure/msal-browser/redirect-bridge";

        broadcastResponseToMainFrame()
            .catch((error) => {
                console.error(
                    "Error broadcasting authentication response:",
                    error
                );
            });
    </script>

</body>
</html>
